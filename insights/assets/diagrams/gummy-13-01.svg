<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Ashwagandha gummy Specifications checklist</title><desc id="desc">IDENTITY: Ashwagandha, with vitamin D2 option · no-added-sugar option; GRADE OR FORM: botanical species, plant part, extract ratio and marker specification if used; APPLICATION: a private-label product-development brief specifying botanical species, plant part, extract ratio and marker specification if used; ACCEPTANCE: Record methods, units and the approved reference</desc><rect width="1600" height="1000" fill="#fbfaf5"/><rect width="1600" height="16" fill="#a98b56"/><text x="64" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#7b642e"><tspan x="64" dy="0">ADVIKASHA  /  BUYER GUIDES</tspan></text><text x="64" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#173e3a"><tspan x="64" dy="0">Ashwagandha gummy</tspan></text><text x="64" y="234" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#57706b"><tspan x="64" dy="0">Specifications checklist</tspan></text><rect x="64" y="286" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="92" y="336" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="92" dy="0">01  IDENTITY</tspan></text><text x="92" y="385" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="92" dy="0">Ashwagandha, with vitamin D2 option ·</tspan><tspan x="92" dy="31">no-added-sugar option.</tspan></text><rect x="818" y="286" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="846" y="336" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="846" dy="0">02  GRADE OR FORM</tspan></text><text x="846" y="385" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="846" dy="0">Botanical species, plant part, extract ratio</tspan><tspan x="846" dy="31">and marker specification if used.</tspan></text><rect x="64" y="600" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="92" y="650" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="92" dy="0">03  APPLICATION</tspan></text><text x="92" y="699" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="92" dy="0">A private-label product-development brief</tspan><tspan x="92" dy="31">specifying botanical species, plant part,</tspan><tspan x="92" dy="31">extract ratio and marker specification if</tspan><tspan x="92" dy="31">used.</tspan></text><rect x="818" y="600" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="846" y="650" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="846" dy="0">04  ACCEPTANCE</tspan></text><text x="846" y="699" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="846" dy="0">Record methods, units and the approved</tspan><tspan x="846" dy="31">reference.</tspan></text><text x="64" y="958" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#5c716a"><tspan x="64" dy="0">Use the agreed product specification. Examples are planning tools, not supplier test results.</tspan></text></svg>