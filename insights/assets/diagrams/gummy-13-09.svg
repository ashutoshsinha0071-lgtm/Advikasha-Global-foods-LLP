<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Ashwagandha gummy Export checklist</title><desc id="desc">MARKET CHECK: confirm the ingredient, serving basis and claims are permitted for the product category in the destination; IDENTITY: Confirm actual origin and processing location; DOCUMENTS: Agree availability, scope, costs and timing; TRANSPORT: Named place, packed weights and carton dimensions</desc><rect width="1600" height="1000" fill="#fbfaf5"/><rect width="1600" height="16" fill="#a98b56"/><text x="64" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#7b642e"><tspan x="64" dy="0">ADVIKASHA  /  BUYER GUIDES</tspan></text><text x="64" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#173e3a"><tspan x="64" dy="0">Ashwagandha gummy</tspan></text><text x="64" y="234" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#57706b"><tspan x="64" dy="0">Export checklist</tspan></text><rect x="64" y="286" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="92" y="336" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="92" dy="0">01  MARKET CHECK</tspan></text><text x="92" y="385" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="92" dy="0">Confirm the ingredient, serving basis and</tspan><tspan x="92" dy="31">claims are permitted for the product</tspan><tspan x="92" dy="31">category in the destination.</tspan></text><rect x="818" y="286" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="846" y="336" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="846" dy="0">02  IDENTITY</tspan></text><text x="846" y="385" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="846" dy="0">Confirm actual origin and processing</tspan><tspan x="846" dy="31">location.</tspan></text><rect x="64" y="600" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="92" y="650" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="92" dy="0">03  DOCUMENTS</tspan></text><text x="92" y="699" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="92" dy="0">Agree availability, scope, costs and timing.</tspan></text><rect x="818" y="600" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="846" y="650" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="846" dy="0">04  TRANSPORT</tspan></text><text x="846" y="699" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="846" dy="0">Named place, packed weights and carton</tspan><tspan x="846" dy="31">dimensions.</tspan></text><text x="64" y="958" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#5c716a"><tspan x="64" dy="0">Use the agreed product specification. Examples are planning tools, not supplier test results.</tspan></text></svg>