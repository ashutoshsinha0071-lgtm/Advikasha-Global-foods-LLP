<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Cumin Seeds (Jeera) Storage checklist</title><desc id="desc">RECEIVE: Record lot, dates, quantity and pack condition; STORE: record odour pickup and keep the stock separated from strong-smelling goods; ROTATE: Use the confirmed shelf life and traceable lot dates; REVIEW: Compare retained material and the handling history</desc><rect width="1600" height="1000" fill="#fbfaf5"/><rect width="1600" height="16" fill="#a98b56"/><text x="64" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#7b642e"><tspan x="64" dy="0">ADVIKASHA  /  BUYER GUIDES</tspan></text><text x="64" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#173e3a"><tspan x="64" dy="0">Cumin Seeds (Jeera)</tspan></text><text x="64" y="234" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#57706b"><tspan x="64" dy="0">Storage checklist</tspan></text><rect x="64" y="286" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="92" y="336" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="92" dy="0">01  RECEIVE</tspan></text><text x="92" y="385" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="92" dy="0">Record lot, dates, quantity and pack</tspan><tspan x="92" dy="31">condition.</tspan></text><rect x="818" y="286" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="846" y="336" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="846" dy="0">02  STORE</tspan></text><text x="846" y="385" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="846" dy="0">Record odour pickup and keep the stock</tspan><tspan x="846" dy="31">separated from strong-smelling goods.</tspan></text><rect x="64" y="600" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="92" y="650" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="92" dy="0">03  ROTATE</tspan></text><text x="92" y="699" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="92" dy="0">Use the confirmed shelf life and traceable</tspan><tspan x="92" dy="31">lot dates.</tspan></text><rect x="818" y="600" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="846" y="650" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="846" dy="0">04  REVIEW</tspan></text><text x="846" y="699" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="846" dy="0">Compare retained material and the handling</tspan><tspan x="846" dy="31">history.</tspan></text><text x="64" y="958" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#5c716a"><tspan x="64" dy="0">Use the agreed product specification. Examples are planning tools, not supplier test results.</tspan></text></svg>