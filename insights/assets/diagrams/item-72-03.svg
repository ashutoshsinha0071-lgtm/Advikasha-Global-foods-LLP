<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Chamomile Flowers Comparisons checklist</title><desc id="desc">COMPARISON: whole chamomile flowers versus cut grade; compare visual presentation and filling consistency; COMMON METHOD: count stems and broken flower material and brew under fixed preparation conditions; USABLE VALUE: whole-flower proportion, grading and tea-bag filling recovery; ORDER REFERENCE: Keep each accepted alternative under its own specification</desc><rect width="1600" height="1000" fill="#fbfaf5"/><rect width="1600" height="16" fill="#a98b56"/><text x="64" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#7b642e"><tspan x="64" dy="0">ADVIKASHA  /  BUYER GUIDES</tspan></text><text x="64" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#173e3a"><tspan x="64" dy="0">Chamomile Flowers</tspan></text><text x="64" y="234" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#57706b"><tspan x="64" dy="0">Comparisons checklist</tspan></text><rect x="64" y="286" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="92" y="336" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="92" dy="0">01  COMPARISON</tspan></text><text x="92" y="385" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="92" dy="0">Whole chamomile flowers versus cut grade;</tspan><tspan x="92" dy="31">compare visual presentation and filling</tspan><tspan x="92" dy="31">consistency.</tspan></text><rect x="818" y="286" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="846" y="336" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="846" dy="0">02  COMMON METHOD</tspan></text><text x="846" y="385" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="846" dy="0">Count stems and broken flower material and</tspan><tspan x="846" dy="31">brew under fixed preparation conditions.</tspan></text><rect x="64" y="600" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="92" y="650" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="92" dy="0">03  USABLE VALUE</tspan></text><text x="92" y="699" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="92" dy="0">Whole-flower proportion, grading and tea-bag</tspan><tspan x="92" dy="31">filling recovery.</tspan></text><rect x="818" y="600" width="718" height="282" rx="18" fill="white" stroke="#cedbd1"/><text x="846" y="650" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b703d"><tspan x="846" dy="0">04  ORDER REFERENCE</tspan></text><text x="846" y="699" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173e3a"><tspan x="846" dy="0">Keep each accepted alternative under its own</tspan><tspan x="846" dy="31">specification.</tspan></text><text x="64" y="958" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#5c716a"><tspan x="64" dy="0">Use the agreed product specification. Examples are planning tools, not supplier test results.</tspan></text></svg>